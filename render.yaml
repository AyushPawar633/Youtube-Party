services:
  - type: web
    name: youtube-watch-party-server
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run start --workspace server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: youtube-watch-party-client
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: youtube-watch-party-client
    runtime: static
    buildCommand: npm ci && npm run build --workspace client
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SERVER_URL
        fromService:
          type: web
          name: youtube-watch-party-server
          envVarKey: RENDER_EXTERNAL_URL
